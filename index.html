<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Añadir a Calendario</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      background-color: #f5f5f7;
      color: #1d1d1f;
    }
    .card {
      background: #ffffff;
      padding: 32px;
      border-radius: 18px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
      text-align: center;
      max-width: 360px;
      width: 90%;
    }
    h1 {
      font-size: 20px;
      margin-bottom: 12px;
      font-weight: 600;
    }
    p {
      font-size: 14px;
      color: #86868b;
      margin-bottom: 24px;
      line-height: 1.4;
    }
    .btn {
      display: inline-block;
      background-color: #0071e3;
      color: #ffffff;
      text-decoration: none;
      padding: 12px 24px;
      border-radius: 980px;
      font-weight: 500;
      font-size: 15px;
      transition: background-color 0.2s ease;
    }
    .btn:hover {
      background-color: #0077ed;
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>Añadir evento al calendario</h1>
    <p>Haz clic en el botón de abajo para descargar o importar tu billete directamente en la app Calendario.</p>
    <a class="btn" href="https://script.google.com/macros/s/AKfycbxbBdiV-39LxiWWtMW3wVEskw7YqsHEe9w4nYoBnJYm4YP0vsccic11x4C9hSJaVRDt/exec">Añadir a Apple Calendar</a>
  </div>

</body>
</html>
