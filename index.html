<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Billetes iryo - Calendario</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      background-color: #f5f5f7;
      color: #1d1d1f;
    }
    .card {
      background: #ffffff;
      padding: 32px;
      border-radius: 18px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
      text-align: center;
      max-width: 380px;
      width: 90%;
    }
    h1 {
      font-size: 20px;
      margin-bottom: 8px;
      font-weight: 600;
    }
    p {
      font-size: 14px;
      color: #86868b;
      margin-bottom: 24px;
    }
    .btn {
      display: block;
      background-color: #0071e3;
      color: #ffffff;
      text-decoration: none;
      padding: 14px 16px;
      border-radius: 12px;
      font-weight: 500;
      font-size: 14px;
      margin-bottom: 12px;
      transition: background-color 0.2s ease;
    }
    .btn:hover {
      background-color: #0077ed;
    }
    .btn-secondary {
      background-color: #e8e8ed;
      color: #0071e3;
    }
    .btn-secondary:hover {
      background-color: #dcdce1;
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>Mis Billetes iryo</h1>
    <p>Haz clic en cualquier viaje para añadirlo directamente a tu Calendario de Apple:</p>
    
    <a class="btn" href="https://script.google.com/macros/s/AKfycbzKJXdOSi2nMbGTAF6_PD6KYGhBW7hvPJpvDkJXYJzDrsVrW7XndJjY_Wn7FLUoDmER/exec?viaje=viaje1">
      23/10 - Madrid ➔ Zaragoza (20:22)
    </a>

    <a class="btn btn-secondary" href="https://script.google.com/macros/s/AKfycbzKJXdOSi2nMbGTAF6_PD6KYGhBW7hvPJpvDkJXYJzDrsVrW7XndJjY_Wn7FLUoDmER/exec?viaje=viaje2">
      25/10 - Zaragoza ➔ Madrid (20:21)
    </a>

    <a class="btn" href="https://script.google.com/macros/s/AKfycbzKJXdOSi2nMbGTAF6_PD6KYGhBW7hvPJpvDkJXYJzDrsVrW7XndJjY_Wn7FLUoDmER/exec?viaje=viaje3">
      13/11 - Madrid ➔ Zaragoza (17:22)
    </a>
  </div>

</body>
</html>
